name: PadSteps
options:
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  PadStepsCore:
    path: .
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ${PADSTEPS_APPLE_TEAM}
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.3.0"
targets:
  PadStepsMac:
    type: application
    platform: macOS
    sources:
      - path: apps/macOS
    dependencies:
      - package: PadStepsCore
    info:
      path: .local/Mac-Info.plist
      properties:
        PadStepsRelayDeviceID: ${PADSTEPS_RELAY_DEVICE_ID}
        PadStepsRelayBundleID: ${PADSTEPS_PHONE_BUNDLE_ID}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${PADSTEPS_MAC_BUNDLE_ID}
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PadSteps
        INFOPLIST_KEY_CFBundleIconFile: AppIcon
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: PadSteps reads your walking pad's measured steps and saves a walking workout when you stop.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      gatherCoverageData: false
  PadStepsPhone:
    type: application
    platform: iOS
    sources:
      - path: apps/iOS
    dependencies:
      - package: PadStepsCore
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: .local/Phone-Info.plist
      properties:
        GIDClientID: ${PADSTEPS_IOS_CLIENT_ID}
        PadStepsStepExportMode: ${PADSTEPS_STEP_EXPORT_MODE}
        PadStepsRecorderClientID: ${PADSTEPS_RECORDER_CLIENT_ID}
        PadStepsCorrectionPublicKey: ${PADSTEPS_CORRECTION_PUBLIC_KEY}
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - ${PADSTEPS_IOS_CALLBACK_SCHEME}
        BGTaskSchedulerPermittedIdentifiers:
          - ${PADSTEPS_PHONE_BUNDLE_ID}.refresh
        UIBackgroundModes: [fetch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${PADSTEPS_PHONE_BUNDLE_ID}
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PadSteps
        INFOPLIST_KEY_NSHealthShareUsageDescription: Read Steps to verify imports and Workouts to wake step syncing when a Google workout arrives.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Save measured walking-pad steps to Apple Health once per walk. Workouts stay in Google Health.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: apps/iOS/PadSteps.entitlements
    scheme:
      gatherCoverageData: false
